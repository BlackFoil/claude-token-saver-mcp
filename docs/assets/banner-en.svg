  <text x="944" y="472" font-family="'Arial',sans-serif" font-size="10.5" fill="#666">Prompt injection detection (20 patterns)</text>
  <text x="944" y="488" font-family="'Arial',sans-serif" font-size="10.5" fill="#666">+ auto-redacts API keys, JWTs &amp; more.</text>

