  <text x="98" y="366" font-family="'Arial',sans-serif" font-size="11" fill="#1b5e20">Set up a local LLM for coding</text>
  <text x="84" y="391" font-family="'Arial',sans-serif" font-size="10" fill="#888">Auto-runs:</text>
  <rect x="148" y="381" width="86" height="18" rx="9" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="0.5"/>
  <text x="191" y="393" text-anchor="middle" font-family="'Arial',sans-serif" font-size="10" fill="#2e7d32">Detect RAM</text>
  <text x="238" y="393" font-family="'Arial',sans-serif" font-size="10" fill="#aaa">→</text>
  <rect x="246" y="381" width="96" height="18" rx="9" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="0.5"/>
  <text x="294" y="393" text-anchor="middle" font-family="'Arial',sans-serif" font-size="10" fill="#2e7d32">Recommend model</text>
  <text x="346" y="393" font-family="'Arial',sans-serif" font-size="10" fill="#aaa">→</text>
  <rect x="354" y="381" width="106" height="18" rx="9" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="0.5"/>
  <text x="407" y="393" text-anchor="middle" font-family="'Arial',sans-serif" font-size="10" fill="#2e7d32">Download (~4 GB)</text>
  <text x="464" y="393" font-family="'Arial',sans-serif" font-size="10" fill="#aaa">→</text>
  <rect x="472" y="381" width="68" height="18" rx="9" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="0.5"/>
  <text x="506" y="393" text-anchor="middle" font-family="'Arial',sans-serif" font-size="10" fill="#2e7d32">Preload</text>
  <text x="84" y="414" font-family="'Arial',sans-serif" font-size="10" fill="#aaa">Everything is handled automatically by Claude Code. No manual steps required.</text>

  <!-- STEP 3 -->
  <circle cx="60" cy="450" r="14" fill="#00695c"/>
  <text x="60" y="455" text-anchor="middle" font-family="'Arial',sans-serif" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="84" y="446" font-family="'Arial',sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">Verify it works</text>
  <rect x="84" y="453" width="478" height="26" rx="4" fill="#1c2026"/>
  <text x="98" y="466" font-family="'Arial',sans-serif" font-size="10" fill="#8b949e">Try asking:</text>
  <text x="160" y="466" font-family="'SF Mono','Cascadia Code',monospace" font-size="10.5" fill="#e6edf3">Write a shuffle function in TypeScript</text>
  <rect x="84" y="485" width="478" height="44" rx="4" fill="#f0f9f5" stroke="#a5d6a7" stroke-width="0.5"/>
  <text x="98" y="502" font-family="'Arial',sans-serif" font-size="10" fill="#888">Success looks like:</text>
  <text x="178" y="502" font-family="'SF Mono','Cascadia Code',monospace" font-size="10" fill="#2e7d32">"Generated by local LLM (qwen2.5-coder:...)"</text>
  <text x="430" y="502" font-family="'Arial',sans-serif" font-size="10" fill="#2e7d32">in the response</text>
  <text x="98" y="522" font-family="'Arial',sans-serif" font-size="9.5" fill="#aaa">If not shown, run ollama list to verify the model is available. See troubleshooting docs.</text>

