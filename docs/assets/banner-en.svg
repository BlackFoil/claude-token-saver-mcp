  <text x="194" y="113" font-family="'Arial',sans-serif" font-size="12" fill="#aaa">Quick Start</text>
  <line x1="40" y1="120" x2="566" y2="120" stroke="#e0e0e0" stroke-width="0.5"/>

  <!-- Prerequisites -->
