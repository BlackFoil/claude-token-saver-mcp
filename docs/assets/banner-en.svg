  <rect x="242" y="126" width="72" height="16" rx="8" fill="#e8f5e9"/>
  <text x="278" y="138" text-anchor="middle" font-family="'SF Mono','Cascadia Code',monospace" font-size="10" fill="#2e7d32">Ollama</text>
  <text x="320" y="138" font-family="'Arial',sans-serif" font-size="11" fill="#888">must be installed</text>

  <!-- STEP 0 -->
  <circle cx="60" cy="167" r="14" fill="#00695c"/>
  <text x="60" y="172" text-anchor="middle" font-family="'Arial',sans-serif" font-size="12" font-weight="700" fill="#fff">0</text>
  <line x1="60" y1="181" x2="60" y2="228" stroke="#b2dfdb" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="84" y="162" font-family="'Arial',sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">Start Ollama</text>
  <rect x="84" y="169" width="478" height="26" rx="4" fill="#1c2026"/>
  <text x="98" y="186" font-family="'SF Mono','Cascadia Code',monospace" font-size="12" fill="#8b949e">$</text>
  <text x="112" y="186" font-family="'SF Mono','Cascadia Code',monospace" font-size="12" fill="#e6edf3">ollama serve</text>
  <text x="84" y="209" font-family="'Arial',sans-serif" font-size="10" fill="#aaa">If not installed, download from ollama.com first</text>

  <!-- STEP 1 -->
  <circle cx="60" cy="238" r="14" fill="#00695c"/>
  <text x="60" y="243" text-anchor="middle" font-family="'Arial',sans-serif" font-size="12" font-weight="700" fill="#fff">1</text>
  <line x1="60" y1="252" x2="60" y2="336" stroke="#b2dfdb" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="84" y="234" font-family="'Arial',sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">Create .mcp.json in your project root</text>
  <rect x="84" y="241" width="478" height="86" rx="4" fill="#1c2026"/>
  <text x="98" y="260" font-family="'SF Mono','Cascadia Code',monospace" font-size="11" fill="#79c0ff">{</text>
  <text x="116" y="276" font-family="'SF Mono','Cascadia Code',monospace" font-size="11" fill="#8b949e">  "mcpServers": {</text>
  <text x="116" y="291" font-family="'SF Mono','Cascadia Code',monospace" font-size="11" fill="#8b949e">    "token-saver": {</text>
  <text x="116" y="306" font-family="'SF Mono','Cascadia Code',monospace" font-size="11" fill="#8b949e">      "command": </text>
  <text x="227" y="306" font-family="'SF Mono','Cascadia Code',monospace" font-size="11" fill="#a5d6ff">"npx"</text>
  <text x="264" y="306" font-family="'SF Mono','Cascadia Code',monospace" font-size="11" fill="#8b949e">, "args": [</text>
  <text x="352" y="306" font-family="'SF Mono','Cascadia Code',monospace" font-size="11" fill="#a5d6ff">"-y"</text>
  <text x="383" y="306" font-family="'SF Mono','Cascadia Code',monospace" font-size="11" fill="#8b949e">, </text>
  <text x="400" y="306" font-family="'SF Mono','Cascadia Code',monospace" font-size="11" fill="#a5d6ff">"claude-token-saver-mcp"</text>
  <text x="98" y="321" font-family="'SF Mono','Cascadia Code',monospace" font-size="11" fill="#79c0ff">    ] } } }</text>

  <!-- STEP 2 -->
  <circle cx="60" cy="346" r="14" fill="#00695c"/>
  <text x="60" y="351" text-anchor="middle" font-family="'Arial',sans-serif" font-size="12" font-weight="700" fill="#fff">2</text>
