  <!-- F1 -->
  <rect x="622" y="436" width="298" height="62" rx="4" fill="#f9f9f9" stroke="#e8e8e8" stroke-width="0.5"/>
  <rect x="622" y="436" width="4" height="62" rx="2" fill="#00695c"/>
  <text x="636" y="455" font-family="'Arial',sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">Fully Local</text>
  <text x="636" y="472" font-family="'Arial',sans-serif" font-size="10.5" fill="#666">Routine tasks run without hitting the Cloud API.</text>
  <text x="636" y="488" font-family="'Arial',sans-serif" font-size="10.5" fill="#666">No data ever leaves your machine.</text>

