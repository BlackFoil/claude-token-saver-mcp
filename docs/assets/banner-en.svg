  <!-- ========== BACKGROUND ========== -->
  <rect width="1280" height="620" fill="#ffffff"/>
  <rect x="0" y="0" width="1280" height="5" fill="#00695c"/>

  <!-- ========== HEADER ========== -->
  <rect x="40" y="22" width="6" height="48" fill="#00695c"/>
  <text x="56" y="50" font-family="'SF Mono','Cascadia Code','Fira Code',monospace" font-size="28" font-weight="700" fill="#1a1a1a" letter-spacing="-0.5">claude-token-saver-mcp</text>
  <text x="56" y="72" font-family="'Arial',sans-serif" font-size="13" fill="#888">MCP server that offloads routine coding tasks to local LLM (Ollama) · Apache-2.0</text>
  <text x="1240" y="44" text-anchor="end" font-family="'Arial',sans-serif" font-size="20" font-weight="700" fill="#00695c">Inference on Cloud, Work on Local</text>
  <text x="1240" y="68" text-anchor="end" font-family="'Arial',sans-serif" font-size="12" fill="#888">~40% of Claude Code API calls are routine tasks → auto-offloaded to local LLM</text>

  <line x1="40" y1="88" x2="1240" y2="88" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="598" y1="88" x2="598" y2="572" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ========== LEFT COLUMN ========== -->

