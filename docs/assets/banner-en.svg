  <text x="636" y="542" font-family="'Arial',sans-serif" font-size="10.5" fill="#666">Track savings in real time.</text>
  <text x="636" y="558" font-family="'Arial',sans-serif" font-size="10.5" fill="#666">~$50–80/month savings at 40% routine ratio.</text>

