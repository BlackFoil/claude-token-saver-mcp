  <text x="904" y="141" text-anchor="middle" font-family="'SF Mono','Cascadia Code',monospace" font-size="11" font-weight="700" fill="#fff">token-saver</text>
  <text x="904" y="160" text-anchor="middle" font-family="'Arial',sans-serif" font-size="10" fill="#1b5e20">Classifies &amp; routes tasks</text>
  <text x="904" y="175" text-anchor="middle" font-family="'Arial',sans-serif" font-size="10" fill="#1b5e20">Routine → Local / Complex → Cloud</text>
  <text x="904" y="191" text-anchor="middle" font-family="'SF Mono','Cascadia Code',monospace" font-size="9" fill="#81c784">security / fallback</text>

  <line x1="988" y1="169" x2="1034" y2="169" stroke="#00695c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1011" y="161" text-anchor="middle" font-family="'SF Mono','Cascadia Code',monospace" font-size="9" fill="#00695c">HTTP</text>

